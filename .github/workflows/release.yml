name: Release

# Push a tag like `v1.2.3` → this builds a signed release APK and
# publishes it as a downloadable GitHub Release asset. Future updates:
# bump versionName/versionCode in app/build.gradle.kts, then
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android action: ubuntu-latest ships the SDK (ANDROID_HOME), and
      # android-actions/setup-android@v3 broke on 2026-09-27 — it installs the removed
      # 'tools' package, which sdkmanager 16.0 rejects.

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        env:
          # Pass untrusted dispatch input through env (never inline into
          # the shell) and validate it before using it downstream.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          NAME="${GITHUB_REF_NAME:-$INPUT_TAG}"
          if ! printf '%s' "$NAME" | grep -Eq '^v[0-9A-Za-z._+-]+$'; then
            echo "Invalid version/tag: '$NAME' (expected like v1.2.3)" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # The release page carries the CHANGELOG section of this version; a tag without one fails
      # here instead of publishing an empty page.
      - name: Release notes
        run: scripts/release-notes.sh "${{ steps.ver.outputs.name }}" > RELEASE_NOTES.md

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "kleene-petze-${{ steps.ver.outputs.name }}.apk"
          sha256sum "kleene-petze-${{ steps.ver.outputs.name }}.apk" | tee SHA256SUMS.txt
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "kleene-petze-${{ steps.ver.outputs.name }}.apk" | tee -a "$GITHUB_STEP_SUMMARY" | tee certs.txt
          # Every release is signed with the same key — the product page publishes this digest,
          # and Android refuses an update signed differently. Never publish anything else.
          grep -q "SHA-256 digest: 0560befbf32c64ede5a518a18bf6799c44f85b45853e97723914d4a84aafe379" certs.txt \
            || { echo "Unexpected signing certificate" >&2; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.name }}
          name: Kleene Petze ${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            kleene-petze-${{ steps.ver.outputs.name }}.apk
            SHA256SUMS.txt

      - name: Clean up keystore
        if: always()
        run: rm -f release.jks
