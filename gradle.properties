org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 8.7.3 bundles a lint engine older than the Compose lint rules shipped with the 2026 BOM —
# their detectors crash with IncompatibleClassChangeError (KaFunctionCall). Running a newer lint
# engine keeps every detector on instead of disabling them one by one.
android.experimental.lint.version=8.13.0
